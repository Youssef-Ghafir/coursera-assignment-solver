<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 40px 20px;
    }
    h1 { font-size: 1.5rem; color: #1d4ed8; margin-bottom: 8px; }
    .counter { font-size: 0.9rem; color: #64748b; margin-bottom: 28px; }
    .scene {
      width: 500px;
      max-width: 100%;
      height: 280px;
      perspective: 900px;
      cursor: pointer;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      border-radius: 16px;
    }
    .card.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: center;
    }
    .front {
      background: #1d4ed8;
      color: #fff;
      box-shadow: 0 8px 32px rgba(29,78,216,0.25);
    }
    .back {
      background: #16a34a;
      color: #fff;
      transform: rotateY(180deg);
      box-shadow: 0 8px 32px rgba(22,163,74,0.25);
    }
    .hint {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 14px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #e2e8f0; color: #374151; }
    button.secondary:hover { background: #cbd5e1; }
    #loading { color: #64748b; font-size: 1.1rem; }
    .toolbar {
      position: fixed;
      top: 16px;
      right: 20px;
      display: flex;
      gap: 8px;
    }
    .toolbar button { padding: 8px 16px; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      h1 { color: #60a5fa; }
      .counter { color: #94a3b8; }
      .hint { color: #475569; }
      button.secondary { background: #1e293b; color: #e2e8f0; }
      #loading { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="secondary" onclick="window.print()">Print / PDF</button>
  </div>

  <div id="loading">Loading your flashcards...</div>

  <div id="app" style="display:none; flex-direction:column; align-items:center;">
    <h1>Flashcards</h1>
    <div class="counter" id="counter"></div>

    <div class="scene" onclick="flipCard()">
      <div class="card" id="card">
        <div class="face front" id="front-text"></div>
        <div class="face back" id="back-text"></div>
      </div>
    </div>
    <p class="hint">Click card to flip &nbsp;·&nbsp; ← → to navigate &nbsp;·&nbsp; Space to flip</p>

    <div class="controls">
      <button class="secondary" onclick="prevCard()">← Prev</button>
      <button onclick="flipCard()">Flip</button>
      <button class="secondary" onclick="nextCard()">Next →</button>
    </div>
  </div>

  <script>
    let cards = [];
    let index = 0;
    let flipped = false;

    function showCard() {
      const card = cards[index];
      document.getElementById('front-text').textContent = card.front;
      document.getElementById('back-text').textContent = card.back;
      document.getElementById('counter').textContent = `Card ${index + 1} of ${cards.length}`;
      flipped = false;
      document.getElementById('card').classList.remove('flipped');
    }

    function flipCard() {
      flipped = !flipped;
      document.getElementById('card').classList.toggle('flipped', flipped);
    }

    function nextCard() {
      if (index < cards.length - 1) { index++; showCard(); }
    }

    function prevCard() {
      if (index > 0) { index--; showCard(); }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextCard();
      else if (e.key === 'ArrowLeft') prevCard();
      else if (e.key === ' ') { e.preventDefault(); flipCard(); }
    });

    function displayCards(cardsArray) {
      cards = cardsArray;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      showCard();
    }

    chrome.storage.local.get(['generatedFlashcards'], (result) => {
      if (result.generatedFlashcards && result.generatedFlashcards.length > 0) {
        displayCards(result.generatedFlashcards);
      } else {
        document.getElementById('loading').textContent = 'Still generating flashcards... this may take up to 30 seconds.';
        chrome.storage.onChanged.addListener((changes, area) => {
          if (area === 'local' && changes.generatedFlashcards && changes.generatedFlashcards.newValue) {
            displayCards(changes.generatedFlashcards.newValue);
          }
        });
      }
    });
  </script>
</body>
</html>
